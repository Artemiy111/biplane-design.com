name: biplane-design

services:
  # One-time helper that seeds the libsql data directory from
  # server/db/data/seed/biplane-design.db on the first run.
  db-init:
    image: alpine:3.22
    restart: "no"
    volumes:
      - ./server/db/data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        target="/data/sqld/db/dbs/default"
        seed="/data/seed/biplane-design.db"
        if [ -f "$$target/data" ]; then
          echo "libsql database already initialized, skipping seed"
          exit 0
        fi
        if [ ! -f "$$seed" ]; then
          echo "seed database not found at $$seed"
          echo "put a libsql/sqlite copy there to seed it:"
          echo "  cp ~/Downloads/biplane-design.db $$seed"
          exit 0
        fi
        mkdir -p "$$target"
        cp "$$seed" "$$target/data"
        echo "seeded $$target/data from $$seed"

  sqld:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33
    restart: unless-stopped
    environment:
      SQLD_DB_PATH: /var/lib/sqld/db
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      SQLD_GRPC_LISTEN_ADDR: 0.0.0.0:5001
    ports:
      - 8080:8080
    volumes:
      - ./server/db/data/sqld:/var/lib/sqld
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    image: oven/bun:1
    init: true
    working_dir: /app
    restart: unless-stopped
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"
    ports:
      - 3000:3000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      DATABASE_URL: http://sqld:8080
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-local-dev-token}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      ENDPOINT_URL: ${ENDPOINT_URL:-http://127.0.0.1:9000}
      REGION: ${REGION:-local}
      BUCKET_NAME: ${BUCKET_NAME:-local}
    env_file:
      - path: .env
        required: false
    depends_on:
      sqld:
        condition: service_healthy

volumes:
  node_modules:
